name: Release

# Bump VERSION on main and this cuts a signed, notarized release through the
# shared shaferllc Mac release (shaferllc/.github). Run it by hand from the
# Actions tab for a dry run: build, sign, notarize and verify, publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — build, sign and notarize without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: shaferllc/.github/.github/workflows/mac-release.yml@main
    with:
      app: Wisp
      notes: >-
        A cursor highlight ring for presenting, screen sharing, and pointing at things — in the spirit of GhostCursor, but **free**. The ring glows around your pointer on every display, yet it never shows up in screenshots, screen recordings, or the screen you share on a call. Your audience sees a clean screen; you see exactly where your cursor is.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
